# markdownlint for the docs lint stage (CI-LINT-01, fleet-standard ci-contract.md).
# The READMEs are built from <picture> art blocks (vm-brand), so inline HTML, long
# lines and a first line that is not a heading are expected.
config:
  MD013: false
  MD033: false
  MD041: false
  # Feature docs carry a title in the frontmatter and the same text as the H1.
  MD025:
    front_matter_title: ""
ignores:
  - "node_modules/**"
  - ".nuxt/**"
  - ".output/**"
  - ".worktrees/**"
  - "repos/**"
