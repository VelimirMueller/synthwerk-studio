# Fleet standard docs-only caller (fleet-standard docs/rollout.md).
name: ci

# pull_request only, no push: one commit runs a check workflow once (CI-COST-05).
on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - name: Detect code changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'
              - '!.github/ISSUE_TEMPLATE/**'

  lint:
    needs: changes
    if: ${{ !failure() && !cancelled() && needs.changes.result == 'success' }}
    permissions:
      contents: read
    uses: VelimirMueller/fleet-workflows/.github/workflows/_ci-lint.yml@v0.0.2
    with:
      stack: docs
      # Not the default docs lint: keep the checks of the old CI for the generated art
      # (JSON config, SVG well-formed) next to Markdown and README file links (CI-LINT-01).
      # The stage runs this block with `bash -eo pipefail`: any failing line fails lint.
      command: |
        npx --yes markdownlint-cli2@0.18.1 '**/*.md'
        grep -oE '(src|srcset|href)="[^"#:]+"' README.md | sed -E 's/^[a-z]+="(.*)"$/\1/' | tr ', ' '\n\n' | grep -vE '^$|^[0-9.]+[wx]$' | sort -u | while read -r ref; do test -e "$ref" || { echo "::error file=README.md::missing file: $ref"; exit 1; }; done
        git ls-files -z '*.json' | xargs -0 -r -n1 jq empty
        git ls-files -z '*.svg' | xargs -0 -r python3 -c 'import sys, xml.etree.ElementTree as ET; [ET.parse(p) for p in sys.argv[1:]]'

  conclusion:
    needs: [changes, lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail when a job failed or the lint stage was skipped
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
          LINT: ${{ needs.lint.result }}
        run: |
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::a job ended as $r"; exit 1 ;; esac
          done
          # A docs-only repo lints every PR (CI-COST-10); only a draft PR skips it.
          if [ "$CHANGES" = "success" ] && [ "$LINT" != "success" ]; then
            echo "::error::the lint stage did not run"; exit 1
          fi
